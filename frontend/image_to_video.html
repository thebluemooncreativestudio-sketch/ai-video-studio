<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image to Video - AI Studio</title>
    <style>
        body { margin: 0; color: white; font-family: Arial; text-align: center; padding: 20px; min-height: 100vh; overflow-x: hidden; }
        
        #bg-video { position: fixed; top: 0; left: 0; min-width: 100%; min-height: 100%; z-index: -10; object-fit: cover; filter: brightness(0.4); }
        
        .box { background: rgba(15, 15, 15, 0.7); padding: 30px; border-radius: 12px; width: 90%; max-width: 600px; margin: 30px auto; box-shadow: 0 4px 20px rgba(255,140,0,0.3); backdrop-filter: blur(15px); border: 1px solid rgba(255,140,0,0.2); text-align: left; }
        h1 { text-align: center; text-shadow: 0 0 15px rgba(0,0,0,0.8); color: #ffde00; margin-top: 20px;}
        label { font-weight: bold; color: #ffde00; font-size: 16px; margin-top: 15px; display: block;}
        input, select, button { display: block; width: 100%; margin: 8px 0 20px; padding: 10px; border-radius: 5px; font-size: 16px; border:none; box-sizing: border-box; }
        button { background: linear-gradient(90deg, #ffde00, #ff8c00); color: black; font-weight: bold; cursor: pointer; margin-top: 20px; padding: 15px;}
        button:hover { box-shadow: 0 0 20px #ffde00; }
        a { color: #ffde00; text-decoration: none; display: block; text-align: center; margin-top: 20px; font-weight: bold;}
        
        /* 🎬 Loading Screen */
        #loading-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; background: black; }
        #loading-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .loading-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffde00; font-size: 32px; font-weight: bold; text-shadow: 0 0 20px #ffde00; z-index: 10000; text-align: center; }
    </style>
</head>
<body>
    <!-- 🎬 Nebula Smoke Video -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="bg_image.mp4" type="video/mp4">
    </video>

    <!-- 🎬 Loading Gears Video -->
    <div id="loading-screen">
        <video autoplay muted loop playsinline id="loading-video">
            <source src="bg_loading.mp4" type="video/mp4">
        </video>
        <div class="loading-text">⚙️ Animating Your Image...<br><span style="font-size: 18px; color: white;">Please do not close this page</span></div>
    </div>

    <h1>🖼️ Single Image Animator</h1>
    <div class="box">
        <form action="/process_single_image" method="POST" enctype="multipart/form-data" onsubmit="document.getElementById('loading-screen').style.display='block';">
            <label>1. Upload a Single Image:</label>
            <input type="file" name="image" accept="image/*" required>
            
            <label>2. Select Cinematic Effect:</label>
            <select name="effect">
                <option value="zoom_in">Zoom In (Slow & Smooth)</option>
                <option value="zoom_out">Zoom Out</option>
                <option value="slide_right">Slide Right</option>
                <option value="slide_left">Slide Left</option>
                <option value="fade_in">Fade In</option>
                <option value="fade_out">Fade Out</option>
            </select>
            
            <label>3. Duration (Seconds):</label>
            <input type="number" name="duration" value="5" min="1" max="30">
            
            <button type="submit">✨ Animate Image</button>
        </form>
    </div>
    <a href="/">⬅ Back to Home</a>
</body>
</html>
