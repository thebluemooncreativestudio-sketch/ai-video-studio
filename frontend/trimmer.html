<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Media Trimmer - AI Video Studio</title>
    <style>
        body { background: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; padding: 30px; }
        .container { max-width: 600px; margin: auto; background: #12141c; padding: 25px; border-radius: 12px; border: 1px solid #00d2ff; }
        h2 { color: #00d2ff; margin-top: 0; }
        label { display: block; margin: 15px 0 5px; color: #99f2c8; font-weight: bold; }
        input { width: 100%; padding: 10px; background: #0d1017; border: 1px solid #38445e; color: white; border-radius: 6px; box-sizing: border-box; }
        button { margin-top: 20px; width: 100%; padding: 12px; background: linear-gradient(90deg, #00d2ff, #3a7bd5); color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #ffde00; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">⬅ Back to Dashboard</a>
        <h2>✂️ Audio/Video Trimmer</h2>
        <form action="/do_trim" method="POST" enctype="multipart/form-data">
            <label>Upload Audio / Video File:</label>
            <input type="file" name="media_file" required>

            <label>Start Time (in seconds, e.g., 10):</label>
            <input type="number" step="0.1" name="start" value="0" required>

            <label>End Time (in seconds, e.g., 25):</label>
            <input type="number" step="0.1" name="end" required>

            <button type="submit">Cut & Download File</button>
        </form>
    </div>
</body>
</html>
